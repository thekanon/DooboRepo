name: Release
on:
  push:
    branches:
      - main # 운영환경
      - develop # 개발환경
      - "release/**" # 릴리스 환경
  workflow_dispatch: # 수동 실행
    inputs:
      branch:
        description: "릴리스 대상 브랜치"
        required: false
        default: "main"

# 동시 실행 방지 및 이전 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 저장소 내용 쓰기 권한 부여
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. 저장소 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 커밋 이력 가져오기

      # 2. pnpm 설정
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      # 3. Node.js 설정 (캐싱 포함)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # 4. 의존성 설치
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      # 5. 프로젝트 빌드
      - name: Build project
        run: pnpm run build
        shell: bash

      # 6. feature 브랜치에서 develop으로 자동 PR 생성
      - name: Create PR to develop from feature branch
        if: startsWith(github.ref, 'refs/heads/feature/')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Auto PR from ${{ github.ref_name }}"
          branch: "auto/pr/${{ github.ref_name }}"
          title: "Auto PR: ${{ github.ref_name }} → develop"
          body: "이 PR은 GitHub Actions에 의해 자동 생성되었습니다."
          base: "develop"

      # 7. main 브랜치일 경우 릴리스 브랜치 생성(git 명령어 사용)
      - name: Create release branch from main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release/${{ github.run_number }}
          git push origin release/${{ github.run_number }}
        shell: bash

      # 8. GitHub 릴리스 생성
      - name: Create GitHub Release
        if: |
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ github.ref == 'refs/heads/main' && 'Release' || 'Pre-release' }} ${{ github.run_number }}
          draft: false
          prerelease: ${{ github.ref != 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
