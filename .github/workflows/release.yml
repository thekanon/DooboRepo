name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
        shell: bash

      # 1. 코드 체크아웃
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. pnpm 설치 (최신 v4 버전 사용)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.6
          run_install: false

      # 3. Node.js 설치 및 pnpm 캐싱
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # 4. 설치 확인
      - name: Verify pnpm
        run: |
          echo "pnpm version -> $(pnpm --version)"
        shell: bash

      # 5. 의존성 설치
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      # 6. 빌드만 실행 (배포하지 않음)
      - name: Run build
        run: pnpm run build
        shell: bash

      # 7. GitHub Release 태그만 생성 (선택사항)
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
